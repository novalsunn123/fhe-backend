name: FHE one-image smoke test

on:
  push:
    branches:
      - agent/rebuild-cicd

permissions:
  contents: read

concurrency:
  group: fhe-one-image-smoke
  cancel-in-progress: false

jobs:
  infer-one-image:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 180
    env:
      FHE_EXPERIMENT: "1"
      FHE_TEST_IMAGE: FHEClient/inputs/2041_0.png
      FHE_BINARY_WEIGHTS: "1"
      FHE_PROFILE: "1"
      CICD_BUILD_JOBS: "2"
      CICD_WEIGHTS_DIR: ${{ github.workspace }}/LowMemoryFHEWeaponResNet20_v1/weights
      CICD_REPORT_DIR: ${{ github.workspace }}/.ci-reports/fhe-one-image-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout source and selected checkpoint
        uses: actions/checkout@v6
        with:
          clean: true
          persist-credentials: false

      - name: Set up Python for checkpoint export
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install CPU-only export dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check numpy==1.26.4
          python3 -m pip install --disable-pip-version-check torch==2.6.0 \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Check runner and input files
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! python3 -c 'import torch, numpy'; then
            echo '::error title=Missing Python dependencies::Runner needs Python 3 with torch and numpy.'
            exit 1
          fi
          if ! test -s LowMemoryFHEWeaponResNet20_v1/training/outputs_fhe_selected/best.pt; then
            echo '::error title=Missing checkpoint::Selected best.pt was not checked out.'
            exit 1
          fi
          if ! test -s 'LowMemoryFHEWeaponResNet20_v1/notebooks/Algorithm 2 - Exporting Weights.ipynb'; then
            echo '::error title=Missing exporter notebook::The weight-export notebook was not checked out.'
            exit 1
          fi
          if ! test -s FHEBackend-batch-limit/FHEClient/inputs/2041_0.png; then
            echo '::error title=Missing sample image::The test image was not checked out.'
            exit 1
          fi
          if test -e "$CICD_WEIGHTS_DIR"; then
            echo '::error title=Stale export directory::Weight export directory already exists before the export step.'
            exit 1
          fi
          echo "Checkpoint SHA-256: $(sha256sum LowMemoryFHEWeaponResNet20_v1/training/outputs_fhe_selected/best.pt | cut -d' ' -f1)"

      - name: Export weights from outputs_fhe_selected/best.pt
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$CICD_REPORT_DIR"
          python3 LowMemoryFHEWeaponResNet20_v1/export_weapon_weights.py \
            --checkpoint LowMemoryFHEWeaponResNet20_v1/training/outputs_fhe_selected/best.pt \
            > "$CICD_REPORT_DIR/export.log" 2>&1 || {
              tail -n 80 "$CICD_REPORT_DIR/export.log"
              exit 1
            }
          test -s "$CICD_WEIGHTS_DIR/fc.bin"
          test -s "$CICD_WEIGHTS_DIR/fc_bias.bin"
          weight_count="$(find "$CICD_WEIGHTS_DIR" -maxdepth 1 -type f -name '*.bin' | wc -l)"
          echo "Exported weight files: $weight_count"
          test "$weight_count" -eq 6315

      - name: Build and run encrypted inference on one image
        working-directory: FHEBackend-batch-limit
        shell: bash
        run: |
          set -Eeuo pipefail
          GITHUB_WORKSPACE="$PWD" ./CICD/run_pipeline.sh

      - name: Check decrypted prediction
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fxq 'Prediction: Handgun' "$CICD_REPORT_DIR/logs/decryption.log"
          echo 'Selected checkpoint classified 2041_0.png as Handgun.' >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize FHE operation profile
        shell: bash
        run: |
          set -Eeuo pipefail
          profile="$CICD_REPORT_DIR/fhe-operation-profile.json"
          test -s "$profile"
          jq -e '.status == "passed" and .bootstrap_summary.count > 0' "$profile" > /dev/null
          profile_summary="$(jq -c '{bootstrap: (.bootstrap_summary | {count, total_seconds, average_seconds, slowest_event}), duration: .duration_summary, convolution_seconds: (.convolution_operation_summary | with_entries(.value |= .total_seconds))}' "$profile")"
          echo "::notice title=FHE operation profile::$profile_summary"
          sed -n '1,22p' "$CICD_REPORT_DIR/fhe-operation-profile.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload non-sensitive benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fhe-one-image-${{ github.sha }}-${{ github.run_id }}
          path: ${{ env.CICD_REPORT_DIR }}
          if-no-files-found: warn
          retention-days: 14
